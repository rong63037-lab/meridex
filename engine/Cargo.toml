[package]
name = "meridex-engine"
version = "0.1.0"
edition = "2021"
description = "Meridex M1 sandbox matching engine for the XAU/USD central limit order book"
license = "UNLICENSED"

[[bin]]
name = "meridex-engine"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[profile.release]
lto = false
codegen-units = 16
